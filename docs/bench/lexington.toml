# The Lexington benchmark page's sources: the four Lexington 2000 models run with the current code, and
# the per-code reference values of Ercolano et al. (2003), Tables 4-7.
#
# docs/bench/lexref.py reads the paper's TeX source and writes the reference CSV, mapping every TeX row
# label to an id through [label]. docs/bench/lexington.py reads the runs (paths relative to the runs
# root, $MOCASSIN_RUNS, default meta.runs_root_default) and computes, for every id whose kind is not
# skip, MOCASSIN-PDR's value:
#
#   hbeta         Hbeta [erg/s] / scale
#   te_hplus      temperature.out's T_e of H+, weighted by n_e n(H+) dV: <T[Np Ne]> of the paper
#   heplus_ratio  ionratio.out's He+ fraction over its H+ fraction: <He+>/<H+> of the paper
#   hei           lineFlux.out's He I recombination lines with wav in window [A], summed
#   heii          lineFlux.out's He II recombination lines with wav_air in window [A], summed
#   line          lineFlux.out's heavy-ion lines in each window [Z, charge, wmin, wmax] (vacuum A), summed;
#                 ir = [Z, charge, um] is the window um*1e4*(1-0.015) to um*1e4*(1+0.015)
#   skip          not compared, for the reason given
#
# display is the row's label as the paper prints it.

[meta]
title = "The Lexington 2000 benchmark: MOCASSIN-PDR against the codes of the workshop"
runs_root_env = "MOCASSIN_RUNS"
runs_root_default = "/home/hmonteiro/software/mocassin_docs/runs"
reference = "docs/bench/ref/lexington2003.csv"
build = "make mocassin"
binary = "docs-v2.0/bin/mocassin.plain"           # relative to the runs root
ranks = 14
seed = 1001

[run.HII40]
path = "docs-v2.0/lex-HII40"
inputs = "docs/bench/inputs/lex-HII40"
fixture = "benchmarks/gas/HII40"
run_time = ""

[run.HII20]
path = "docs-v2.0/lex-HII20"
inputs = "docs/bench/inputs/lex-HII20"
fixture = "benchmarks/gas/HII20"
run_time = ""

[run.PN150]
path = "docs-v2.0/lex-PN150"
inputs = "docs/bench/inputs/lex-PN150"
fixture = "benchmarks/gas/PN150"
run_time = ""

[run.PN75]
path = "docs-v2.0/lex-PN75"
inputs = "docs/bench/inputs/lex-PN75"
fixture = "benchmarks/gas/PN75"
run_time = ""

